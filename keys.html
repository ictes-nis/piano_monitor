<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>鍵盤だけ — ピアノ演奏モニタ</title>
<style>
  :root{
    --bg:#12141a; --panel:#1a1d26; --panel2:#232733; --line:#2f3444;
    --fg:#e6e9f0; --dim:#8b93a7; --dim2:#5f677a;
    --accent:#5cc8ff; --ok:#5ddba0; --warn:#ffcc66; --ng:#ff7b7b;
    --kw:#eceef4; --kb:#20242e; --kedge:#0d0f14;
    --on:#5cc8ff;          /* 指で押している */
    --ped:#ffcc66;         /* ペダルで残っている */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:15px; line-height:1.5;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* 配信ソフトに重ねるとき用。ページの地を透明にする。
     下に何が映るか分からないので、文字と線には縁取りを付けて読めるようにする */
  body.clear{background:transparent}
  body.clear #stage{background:transparent;border:0;box-shadow:none}
  body.clear #kb text{paint-order:stroke;stroke:#000000b0;stroke-width:2.6px;stroke-linejoin:round}
  body.clear #kb line{stroke:#ffffff88}
  body.clear .pd{color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000}
  body.clear .pd .vv{color:#fff}
  body.clear .pd .bar{background:#00000066;box-shadow:0 0 0 1px #0006}

  #bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 12px;background:#0d0f14ee;border-bottom:1px solid var(--line);
    transition:opacity .25s; flex:0 0 auto;
  }
  body.hidebar #bar{opacity:0;pointer-events:none}
  body.nobar #bar{display:none}
  button{
    background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:7px 12px;font-size:14px;font-family:inherit;cursor:pointer;min-height:36px;
  }
  button.primary{background:var(--accent);color:#06202c;border-color:var(--accent);font-weight:600}
  button.rec{background:#b0353a;border-color:#c9464b;color:#fff;font-weight:600}
  button:disabled{opacity:.4;cursor:default}
  select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;max-width:220px}
  label.fld{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:13px}
  label.chk{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:13px;cursor:pointer}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
  .stat{font-size:13px;color:var(--dim)}
  .stat.ok{color:var(--ok)} .stat.ng{color:var(--ng)} .stat.warn{color:var(--warn)}
  .sp{flex:1 1 auto}
  .tip{font-size:11.5px;color:var(--dim2)}
  .tip code{background:var(--panel2);border-radius:4px;padding:1px 5px;color:var(--dim)}
  .modal{position:fixed;inset:0;z-index:50;padding:18px;background:#0009;
    display:flex;align-items:center;justify-content:center}
  .modal[hidden]{display:none}
  .mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;width:100%;max-width:400px;box-shadow:0 14px 44px #000a}
  .mtitle{font-size:15px;font-weight:600;margin-bottom:6px}
  .mbody{font-size:13px;color:var(--dim);margin-bottom:12px;overflow-wrap:anywhere}
  .mrow{display:flex;gap:8px;justify-content:flex-end}
  .mrow .danger{background:#b0353a;border-color:#c9464b;color:#fff;font-weight:600}

  #stage{
    flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;
    gap:8px;padding:10px 12px 12px;background:var(--bg);
  }
  #kb{display:block;width:100%;flex:1 1 auto;min-height:0;touch-action:none}
  /* 流れる表示。鍵盤の真上の余っている場所を全部使う */
  #flow{display:none;width:100%;flex:1 1 auto;min-height:60px;touch-action:none}
  body.playing #flow{cursor:grab}
  body.flowon #flow{display:block}
  body.flowon #kb{flex:0 1 auto;height:auto;max-height:62%}
  #spdWrap{display:none}
  body.flowon #spdWrap{display:inline-flex}
  #spdWrap input[type=range]{width:110px;accent-color:var(--accent)}
  #spdWrap b{color:var(--fg);font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right}
  #seekRow{display:flex;align-items:center;gap:8px;flex:0 0 100%;min-width:0;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  #seekRow span{min-width:3.8em;text-align:center}
  #seek{flex:1;min-width:0;margin:0;accent-color:var(--accent);cursor:pointer;touch-action:none}
  #seek:disabled{opacity:.4;cursor:default}
  #pedals{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  body.noped #pedals{display:none}
  .pd{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
  .pd .nm{width:6.4em;flex:0 0 auto}
  .pd .bar{flex:1 1 auto;height:14px;background:#232733cc;border-radius:7px;position:relative;overflow:hidden}
  .pd.damper .bar{height:45px}
  .pd .bar i{display:block;height:100%;background:var(--dim2);border-radius:7px;transition:width .05s linear}
  .pd .bar u{position:absolute;top:0;bottom:0;width:1px;background:var(--dim2);opacity:.75}
  .pd.down .bar i{background:var(--ped)}
  .pd .vv{width:2.6em;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto;color:var(--fg)}
</style>
</head>
<body>

<div id="bar">
  <button id="btnConnect" class="primary">MIDIに接続</button>
  <span id="status" class="stat">未接続</span>
  <label class="chk"><input type="checkbox" id="optFlow">流れる表示</label>
  <label class="chk" id="spdWrap">速さ
    <input type="range" id="flowSpd" min="10" max="80" step="1" value="30">
    <b id="spdVal">3.0</b>秒</label>
  <label class="chk"><input type="checkbox" id="optVel" checked>ベロシティ</label>
  <label class="chk"><input type="checkbox" id="optPed" checked>ペダル</label>
  <label class="chk"><input type="checkbox" id="optClear">背景を透明に</label>
  <button id="btnRec" class="rec">● 録音開始</button>
  <span id="recStat" class="stat"></span>
  <label class="fld">演奏 <select id="takeSel" aria-label="演奏の一覧"></select></label>
  <button id="btnPlay">▶ 再生</button>
  <label class="fld">出力 <select id="outSel" aria-label="再生の出力先"></select></label>
  <button id="btnMid">.mid 保存</button>
  <button id="btnDel">削除</button>
  <button id="btnImport">.mid 読み込み</button>
  <input id="midFile" type="file" accept=".mid,.midi,audio/midi" hidden>
  <span id="playStat" class="stat"></span>
  <div id="seekRow"><span id="seekNow">0:00.0</span><input id="seek" type="range" min="0" max="1" value="0" step="1" aria-label="再生位置" disabled><span id="seekEnd">0:00.0</span></div>
  <span class="sp"></span>
  <span class="tip">配信ソフトに入れるときは <code>keys.html?clear=1&amp;bar=0</code> のように付けると、透明背景でこのバーごと消せます</span>
</div>

<div id="stage">
  <canvas id="flow" aria-label="再生中は上下にドラッグして再生位置を調整"></canvas>
  <svg id="kb" preserveAspectRatio="xMidYMax meet" aria-label="鍵盤"></svg>
  <div id="pedals"></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mtitle" id="mTitle">この録音を削除しますか？</div>
    <div class="mbody" id="mBody"></div>
    <div class="mrow">
      <button id="mCancel">やめる</button>
      <button id="mOk" class="danger">削除する</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =======================================================================
   鍵盤とダンパーペダルだけを出すページ。配信ソフト（OBSなど）の
   ブラウザソースに入れて、演奏の手元を映すのが目的。
   本体（index.html）から、MIDIの受け取りと発音の考え方だけを持ってきている。
   ======================================================================= */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const mod = (a,b) => ((a%b)+b)%b;
function confirmDelete(name){
  return new Promise(resolve=>{
    const modal=$('modal'), cancel=$('mCancel'), ok=$('mOk');
    $('mBody').textContent=`「${name}」　もとに戻せません。`;
    modal.hidden=false;
    const done=value=>{
      modal.hidden=true;
      cancel.removeEventListener('click',onCancel);
      ok.removeEventListener('click',onOk);
      modal.removeEventListener('click',onBack);
      document.removeEventListener('keydown',onKey);
      resolve(value);
    };
    const onCancel=()=>done(false), onOk=()=>done(true);
    const onBack=e=>{ if(e.target===modal) onCancel(); };
    const onKey=e=>{ if(e.key==='Escape') onCancel(); };
    cancel.addEventListener('click',onCancel);
    ok.addEventListener('click',onOk);
    modal.addEventListener('click',onBack);
    document.addEventListener('keydown',onKey);
    cancel.focus();
  });
}

const Q=new URLSearchParams(location.search);
const qb=(k,d)=>Q.has(k)?!/^(0|false|no)$/i.test(Q.get(k)):d;

const S={
  held:new Map(),        /* note -> velocity（指で押している） */
  vel:new Map(),         /* note -> 表示するベロシティ。鳴っている間の最大値 */
  pedHeld:new Set(),     /* 指は離したが、ペダルで鳴っている */
  sost:new Set(),
  cc:{64:0,66:0,67:0},
  seenCC:{64:true,66:false,67:false},
  showVel:true, showPed:true, clear:false,
  flow:false, flowSec:3.0,      /* 流れる表示と、上まで流れきる時間（秒） */
  recording:false, recT0:0, events:[], takes:[], curId:null,
};
const damperDown = () => S.cc[64]>=64;
const sounding = () => { const s=new Set(S.held.keys()); for(const n of S.pedHeld) s.add(n); return s; };

/* ===== MIDI ===== */
let midi=null;
const setStatus=(t,c)=>{ const e=$('status'); e.textContent=t; e.className='stat'+(c?' '+c:''); };
async function connectMidi(auto){
  if(!navigator.requestMIDIAccess){
    setStatus('このブラウザは Web MIDI API に非対応です','ng');
    $('btnConnect').disabled=true; return;
  }
  if(!auto) setStatus('接続中…');
  try{ midi=await navigator.requestMIDIAccess({sysex:false}); }
  catch(e){
    /* 自動接続は、許可がまだのときに黙って失敗する。ボタンを押してもらう */
    if(!auto) setStatus('MIDIへのアクセスが拒否されました: '+e.message,'ng');
    return;
  }
  midi.onstatechange=attachMidi;
  attachMidi();
  $('btnConnect').disabled=true;
  armHide();
}
function attachMidi(ev){
  /* 押している途中で機器が切れると、ノートオフが来ないまま鍵が光り続ける。
     切断を見たら表示を白紙に戻す（Bluetooth MIDI では時々起きる） */
  if(ev && ev.port && ev.port.state==='disconnected') panic();
  const names=[];
  for(const i of midi.inputs.values()){ i.onmidimessage=e=>handleMessage(e.data); names.push(i.name); }
  refreshOutputs();
  if(!names.length) setStatus('入力デバイスが見つかりません','warn');
  else setStatus('接続済み：'+names.join(' / '),'ok');
}
function handleMessage(data){
  const st=data[0];
  if(st>=0xF0) return;
  if((st&0x0F)===9) return;                     /* ch10 はドラム。捨てる */
  const type=st&0xF0, d1=data[1], d2=data[2];
  if(type===0x90&&d2>0) noteOn(d1,d2);
  else if(type===0x80||(type===0x90&&d2===0)) noteOff(d1);
  else if(type===0xB0){
    if(d1===64||d1===66||d1===67) controlPedal(d1,d2);
    else if(d1===120||d1===123) panic();
  }
}
window.__inject = b => handleMessage(Uint8Array.from(b));

/* ===== 発音のモデル（本体と同じ） ===== */
function pruneVel(){
  const snd=sounding();
  for(const n of S.vel.keys()) if(!snd.has(n)) S.vel.delete(n);
}
function noteOn(n,v){
  const prev = sounding().has(n) ? (S.vel.get(n)||0) : 0;
  S.held.set(n,v); S.pedHeld.delete(n);
  S.vel.set(n, Math.max(prev,v));               /* 鳴っている間は大きいほうを残す */
  if(S.flow){ endRibbon(n); startRibbon(n,v,COL_ON); }   /* 弾き直しは帯を区切る */
  syncRibbons(); rec({k:'on',a:n,b:v}); render();
}
function noteOff(n){
  if(!S.held.has(n)) return;
  S.held.delete(n);
  if(damperDown()||S.sost.has(n)) S.pedHeld.add(n);
  pruneVel(); syncRibbons(); rec({k:'off',a:n,b:0}); render();
}
function controlPedal(cc,v){
  const prev=S.cc[cc];
  S.cc[cc]=v; S.seenCC[cc]=true;
  rec({k:'cc',a:cc,b:v});
  if(cc===64 && prev>=64 && v<64)
    for(const n of [...S.pedHeld]) if(!S.sost.has(n)) S.pedHeld.delete(n);
  if(cc===66){
    if(prev<64&&v>=64) S.sost=new Set(S.held.keys());
    else if(prev>=64&&v<64){ S.sost.clear(); if(!damperDown()) S.pedHeld.clear(); }
  }
  pruneVel(); syncRibbons(); render();
}
function panic(){
  S.held.clear(); S.pedHeld.clear(); S.sost.clear(); S.vel.clear();
  S.cc={64:0,66:0,67:0};
  for(const r of ribbons) if(r.t1===null) r.t1=performance.now();
  live.clear();
  render();
}

/* =======================================================================
   流れる表示（音ゲー風）
   弾いている間ずっと帯が伸び、離すと下端も動きだして上へ流れていく。
   指で押している間は青、ペダルだけで残っている間は黄。色が変わる境目で
   帯を1本区切ることで、1本の帯を塗り分けずに済ませている。
   ======================================================================= */
const COL_ON='#5cc8ff', COL_PED='#ffcc66';
const ribbons=[];                 /* {n,x,w,col,t0,t1} t1=null なら伸びている最中 */
const live=new Map();             /* note -> いま伸ばしている帯 */
let flowRaf=null, G=null;
const playbackFlowCache=new WeakMap();

/* 鳴っている音と帯を合わせる。ペダルに移ったら色が変わるので、そこで区切る */
function syncRibbons(){
  if(PB.playing||PB.scrubbing) return;
  if(!S.flow){ live.clear(); return; }
  const snd=sounding();
  for(const [n,r] of [...live]){
    if(!snd.has(n)){ endRibbon(n); continue; }
    const want = S.held.has(n) ? COL_ON : COL_PED;
    if(r.col!==want){ endRibbon(n); startRibbon(n, S.vel.get(n)||90, want); }
  }
  for(const n of snd) if(!live.has(n)) startRibbon(n, S.vel.get(n)||90, S.held.has(n)?COL_ON:COL_PED);
}

function ribbonBox(n){
  const pc=mod(n,12);
  return isBlack(pc) ? {x:keyCX(n)-BW/2, w:BW} : {x:whiteX(n)+0.6, w:KW-1.2};
}
function startRibbon(n,v,col){
  const b=ribbonBox(n);
  const r={n, x:b.x, w:b.w, col, a:0.45+0.55*clamp(v/127,0,1), t0:performance.now(), t1:null};
  ribbons.push(r); live.set(n,r);
  if(ribbons.length>600) ribbons.splice(0, ribbons.length-600);
  return r;
}
function endRibbon(n){
  const r=live.get(n);
  if(r){ r.t1=performance.now(); live.delete(n); }
  return r;
}
/* 再生時は録音の時刻から帯を作る。これなら途中へ移動しても前後の音を描ける。 */
function playbackRibbons(take){
  if(playbackFlowCache.has(take)) return playbackFlowCache.get(take);
  const result=[], active=new Map(), held=new Set(), pedHeld=new Set(), sost=new Set(), velocity=new Map();
  let damper=0, sostenuto=0;
  const close=(n,t)=>{ const r=active.get(n); if(r) r.t1=t; active.delete(n); };
  const open=(n,v,col,t)=>{
    const b=ribbonBox(n);
    const r={n,...b,col,a:0.45+0.55*clamp(v/127,0,1),t0:t,t1:take.dur};
    result.push(r); active.set(n,r);
  };
  const release=(n,t)=>{ close(n,t); pedHeld.delete(n); velocity.delete(n); };
  for(const e of take.events){
    const t=clamp(e.t,0,take.dur), n=e.a;
    if(e.k==='on'){
      close(n,t); held.add(n); pedHeld.delete(n);
      velocity.set(n,Math.max(velocity.get(n)||0,e.b));
      open(n,e.b,COL_ON,t);
    }else if(e.k==='off'){
      if(!held.has(n)) continue;
      held.delete(n); close(n,t);
      if(damper>=64||sost.has(n)){
        pedHeld.add(n); open(n,velocity.get(n)||90,COL_PED,t);
      }else velocity.delete(n);
    }else if(e.k==='cc'&&n===64){
      const was=damper; damper=e.b;
      if(was>=64&&damper<64)
        for(const key of [...pedHeld]) if(!sost.has(key)) release(key,t);
    }else if(e.k==='cc'&&n===66){
      const was=sostenuto; sostenuto=e.b;
      if(was<64&&sostenuto>=64) for(const key of held) sost.add(key);
      else if(was>=64&&sostenuto<64){
        sost.clear();
        if(damper<64) for(const key of [...pedHeld]) release(key,t);
      }
    }
  }
  playbackFlowCache.set(take,result);
  return result;
}
/* 画面上のどこに鍵盤の x があるか。SVG は余白を作って収まるので、その分をずらす */
function syncFlow(){
  const el=$('kb'), cv=$('flow');
  const r=el.getBoundingClientRect(), c=cv.getBoundingClientRect();
  const vb=(el.getAttribute('viewBox')||'0 0 1196 288').split(/\s+/).map(Number);
  const s=Math.min(r.width/vb[2], r.height/vb[3]);
  G={s, ox:r.left+(r.width-vb[2]*s)/2-vb[0]*s-c.left, h:c.height, w:c.width};
  const dpr=Math.min(devicePixelRatio||1, 2);
  if(cv.width!==Math.round(c.width*dpr)||cv.height!==Math.round(c.height*dpr)){
    cv.width=Math.round(c.width*dpr); cv.height=Math.round(c.height*dpr);
  }
}
function drawFlow(){
  if(!S.flow){ flowRaf=null; return; }
  const cv=$('flow'), ctx=cv.getContext('2d');
  if(!G) syncFlow();
  const dpr=cv.width/(G.w||1);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,G.w,G.h);
  const playing=PB.playing||PB.scrubbing, take=playing?curTake():null;
  const now=take?(PB.scrubbing?PB.pos:Math.min(pbElapsed(),take.dur)):performance.now();
  const source=take?playbackRibbons(take):ribbons;
  const H=G.h, px=H/(S.flowSec*1000);   /* 1ミリ秒あたりの上り幅 */
  for(let i=source.length-1;i>=0;i--){
    const r=source[i];
    const yTop=H-(now-r.t0)*px;
    const yBot=H-(now-(r.t1===null?now:r.t1))*px;
    if(yBot<-4){ if(!take) ribbons.splice(i,1); continue; }
    if(yTop>H) continue;
    const x=G.ox+r.x*G.s, w=Math.max(2,r.w*G.s);
    const y=Math.max(yTop,-8), hh=Math.min(yBot,H)-y;
    if(hh<=0) continue;
    ctx.globalAlpha=r.a;
    ctx.fillStyle=r.col;
    const rad=Math.min(4, w/2, hh/2);
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,hh,rad); else ctx.rect(x,y,w,hh);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  flowRaf=requestAnimationFrame(drawFlow);
}
function flowStart(){
  if(!S.flow||flowRaf!==null) return;
  syncFlow();
  flowRaf=requestAnimationFrame(drawFlow);
}

/* ===== 鍵盤（88鍵 A0=21〜C8=108） ===== */
const KB_LO=21, KB_HI=108;
const isBlack = pc => pc===1||pc===3||pc===6||pc===8||pc===10;
const BLACK_OFF = {1:0.89, 3:1.11, 6:0.85, 8:1.00, 10:1.15};
const KW=23, KH=118, BW=13.2, BH=74, KTOP=4;
const WHITES=[]; for(let n=KB_LO;n<=KB_HI;n++) if(!isBlack(mod(n,12))) WHITES.push(n);
const whiteX = n => WHITES.indexOf(n)*KW;
const keyCX = n => isBlack(mod(n,12)) ? whiteX(n-1)+BLACK_OFF[mod(n,12)]*KW : whiteX(n)+KW/2;
const VEL_TOP=-126, VEL_BASE=-6;

function drawKeyboard(){
  const snd=sounding();
  const vb = S.showVel ? '0 -146 1196 288' : '0 -6 1196 148';
  $('kb').setAttribute('viewBox',vb);
  const fillOf=n=>{
    if(S.held.has(n)){
      const v=S.vel.get(n)||96;
      return {c:'var(--on)', o:(0.55+0.45*clamp(v/110,0,1)).toFixed(2)};
    }
    if(snd.has(n)) return {c:'var(--ped)', o:'0.80'};
    return null;
  };
  let s='';

/* ===== 録音と保存 ===== */
const curTake=()=>S.takes.find(t=>t.id===S.curId)||null;
const fmtTime=ms=>{ const s=Math.max(0,ms)/1000, m=Math.floor(s/60); return `${m}:${(s-m*60).toFixed(1).padStart(4,'0')}`; };
function rec(e){
  if(S.recording&&!PB.playing) S.events.push({t:Math.round(performance.now()-S.recT0),...e});
}
function startRec(){
  if(PB.playing) stopPlay();
  S.recording=true; S.recT0=performance.now(); S.events=[];
  refreshSeek();
  for(const [n,v] of S.held) S.events.push({t:0,k:'on',a:n,b:v});
  for(const cc of [64,66,67]) if(S.cc[cc]>0) S.events.push({t:0,k:'cc',a:cc,b:S.cc[cc]});
  $('btnRec').textContent='■ 停止'; $('btnRec').classList.remove('rec');
  tickRec();
}
let recTimer=null;
function tickRec(){
  clearTimeout(recTimer); if(!S.recording) return;
  $('recStat').textContent=`録音中 ${fmtTime(performance.now()-S.recT0)}　イベント ${S.events.length}`;
  $('recStat').className='stat warn'; recTimer=setTimeout(tickRec,200);
}
function stopRec(){
  S.recording=false; clearTimeout(recTimer);
  refreshSeek();
  $('btnRec').textContent='● 録音開始'; $('btnRec').classList.add('rec');
  const ev=S.events, dur=Math.round(performance.now()-S.recT0), open=new Set();
  for(const e of ev){ if(e.k==='on') open.add(e.a); else if(e.k==='off') open.delete(e.a); }
  for(const n of open) ev.push({t:dur,k:'off',a:n,b:0});
  ev.sort((a,b)=>a.t-b.t);
  if(!ev.length){ $('recStat').textContent='何も記録されませんでした'; $('recStat').className='stat'; return; }
  const at=Date.now(), d=new Date(at), p=n=>String(n).padStart(2,'0');
  const take={id:'t'+at+'-'+Math.random().toString(36).slice(2,8),at,
    name:`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`,dur,events:ev};
  S.takes.unshift(take); S.curId=take.id;
  saveTakes(); refreshTakes();
  $('recStat').textContent='録音しました'; $('recStat').className='stat ok';
}
const LS_TAKES='pm.v1.takes';
function saveTakes(){
  const takes=[...S.takes];
  while(takes.length){
    try{ localStorage.setItem(LS_TAKES,JSON.stringify(takes)); return; }
    catch(e){ takes.pop(); }
  }
  try{ localStorage.removeItem(LS_TAKES); }catch(e){}
}
function loadTakes(){
  const previous=S.curId;
  try{ const a=JSON.parse(localStorage.getItem(LS_TAKES)||'[]');
    if(Array.isArray(a)) S.takes=a.filter(t=>t&&Array.isArray(t.events));
  }catch(e){}
  S.curId=S.takes.some(t=>t.id===previous)?previous:(S.takes[0]?.id||null);
}
function refreshTakes(){
  $('takeSel').replaceChildren(...(S.takes.length
    ? S.takes.map(t=>{ const o=new Option(t.name,t.id); o.selected=t.id===S.curId; return o; })
    : [new Option('録音なし','')]));
  $('btnPlay').disabled=$('btnMid').disabled=$('btnDel').disabled=!curTake();
  refreshSeek();
}

const LOOKAHEAD=250;                       /* ms。これだけ先まで送っておく */
const PB={
  playing:false, startAt:0, offset:0,      /* offset = 再生開始位置(ms) */
  sendIdx:0, dispIdx:0, damper:0,
  timer:null, raf:null, out:null,          /* out=null なら内蔵音 */
  onNotes:new Set(),                       /* 消し忘れ防止に、鳴らした音を控える */
  pos:0, scrubbing:false, request:0,
};
const pbElapsed = () => PB.offset + (performance.now()-PB.startAt);
function refreshSeek(){
  const take=curTake(), seek=$('seek'), dur=take?.dur||0;
  const pos=take?clamp(PB.pos,0,dur):0;
  seek.max=String(Math.max(1,dur));
  seek.value=String(Math.round(pos));
  seek.disabled=!take||S.recording;
  seek.setAttribute('aria-valuetext',`${fmtTime(pos)} / ${fmtTime(dur)}`);
  $('seekNow').textContent=fmtTime(pos);
  $('seekEnd').textContent=fmtTime(dur);
}
/* 途中から再生するときに、直前までの鍵とペダルの状態を戻す。 */
function playbackState(take,position){
  const held=new Map(), vel=new Map(), pedHeld=new Set(), sost=new Set();
  const cc={64:0,66:0,67:0}, seen={64:true,66:false,67:false};
  const prune=()=>{ for(const n of vel.keys()) if(!held.has(n)&&!pedHeld.has(n)) vel.delete(n); };
  for(const e of take.events){
    if(e.t>=position) break;
    const n=e.a;
    if(e.k==='on'){
      const prev=held.has(n)||pedHeld.has(n)?vel.get(n)||0:0;
      held.set(n,e.b); pedHeld.delete(n); vel.set(n,Math.max(prev,e.b));
    }else if(e.k==='off'){
      if(!held.has(n)) continue;
      held.delete(n);
      if(cc[64]>=64||sost.has(n)) pedHeld.add(n);
      prune();
    }else if(e.k==='cc' && Object.hasOwn(cc,n)){
      const prev=cc[n]; cc[n]=e.b; seen[n]=true;
      if(n===64&&prev>=64&&e.b<64)
        for(const key of [...pedHeld]) if(!sost.has(key)) pedHeld.delete(key);
      if(n===66){
        if(prev<64&&e.b>=64) for(const key of held.keys()) sost.add(key);
        else if(prev>=64&&e.b<64){ sost.clear(); if(cc[64]<64) pedHeld.clear(); }
      }
      prune();
    }
  }
  return {held,vel,pedHeld,sost,cc,seen};
}

/* ---- 内蔵音 ------------------------------------------------------------
   本命は「録音したピアノの音」を使うこと。Salamander Grand Piano
   （Alexander Holm、CC-BY 3.0。ヤマハ C5 を録ったもの）を Tone.js の
   配布先から、必要になったときだけ取りに行く。3半音おきに30音・約1.9MB。
   一度読めば Cache API に残るので、次からは通信なしで鳴る。
   取りに行けなかったときは、下の合成音に落ちる。 */
const SF_BASE='https://tonejs.github.io/audio/salamander/';
const SF_NOTES=[[21,'A0'],[24,'C1'],[27,'Ds1'],[30,'Fs1'],[33,'A1'],[36,'C2'],[39,'Ds2'],
  [42,'Fs2'],[45,'A2'],[48,'C3'],[51,'Ds3'],[54,'Fs3'],[57,'A3'],[60,'C4'],[63,'Ds4'],
  [66,'Fs4'],[69,'A4'],[72,'C5'],[75,'Ds5'],[78,'Fs5'],[81,'A5'],[84,'C6'],[87,'Ds6'],
  [90,'Fs6'],[93,'A6'],[96,'C7'],[99,'Ds7'],[102,'Fs7'],[105,'A7'],[108,'C8']];
const PIANO={state:'none', bufs:new Map(), notes:[]};   /* none / loading / ready / failed */

/* 録音は最長20秒近くあり、そのまま持つとメモリを食う。モノラルにして、
   音の高さに応じた長さで切る（末尾は短くフェード）。 */
function trimMono(c, buf, f){
  const maxDur=clamp(1.5+700/f, 1.5, 12);
  const n=Math.min(buf.length, Math.floor(maxDur*buf.sampleRate));
  const out=c.createBuffer(1, n, buf.sampleRate), d=out.getChannelData(0);
  const L=buf.getChannelData(0), R=buf.numberOfChannels>1?buf.getChannelData(1):L;
  for(let i=0;i<n;i++) d[i]=(L[i]+R[i])*0.5;
  const fade=Math.min(2000,n);
  for(let i=0;i<fade;i++) d[n-fade+i]*=1-i/fade;
  return out;
}
async function loadPiano(onProgress){
  if(PIANO.state==='ready') return true;
  if(PIANO.state==='loading') return false;
  PIANO.state='loading';
  const c=ac();
  let cache=null;
  try{ cache=await caches.open('pm-salamander-v1'); }catch(e){}
  let done=0;
  await Promise.all(SF_NOTES.map(async ([n,name])=>{
    const url=SF_BASE+name+'.mp3';
    try{
      let res=null;
      if(cache) try{ res=await cache.match(url); }catch(e){}
      if(!res){
        res=await fetch(url);
        if(!res.ok) throw new Error('HTTP '+res.status);
        if(cache) try{ await cache.put(url,res.clone()); }catch(e){}
      }
      const raw=await c.decodeAudioData(await res.arrayBuffer());
      PIANO.bufs.set(n, trimMono(c, raw, 440*Math.pow(2,(n-69)/12)));
    }catch(e){}
    if(onProgress) onProgress(++done, SF_NOTES.length);
  }));
  PIANO.notes=[...PIANO.bufs.keys()].sort((a,b)=>a-b);
  PIANO.state = PIANO.bufs.size>=SF_NOTES.length-2 ? 'ready' : 'failed';
  return PIANO.state==='ready';
}
/* いちばん近い録音を選ぶ。3半音おきなので、ずらすのは最大1半音 */
function nearestSample(note){
  let best=PIANO.notes[0];
  for(const n of PIANO.notes) if(Math.abs(n-note)<Math.abs(best-note)) best=n;
  return best;
}

let AC=null, MASTER=null, REVSEND=null, WAVES=null;
const voices=new Map();                    /* note -> [voice] */
const sustained=new Set();                 /* ペダルで残している音 */
const NO_DAMPER=89;                        /* これ以上の音にはダンパーが無い */

function makeIR(c,dur,decay){
  const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
  }
  return b;
}
/* 倍音の群。n番目の倍音の大きさは n^-1.1 に、ハンマー位置によるへこみを掛ける */
function makeWaves(c){
  const amp=n=>Math.pow(n,-1.1)*Math.abs(Math.sin(n*Math.PI/8.2));
  const mk=(from,to)=>{
    const re=new Float32Array(to+1), im=new Float32Array(to+1);
    for(let n=from;n<=to;n++) im[n]=amp(n);
    return c.createPeriodicWave(re,im,{disableNormalization:true});
  };
  return [mk(1,4), mk(5,10), mk(11,20)];
}
function ac(){
  if(AC) return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  /* 和音とペダルで音が積み重なると簡単に振り切れるので、最後に軽く抑える */
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-14; comp.knee.value=12; comp.ratio.value=8;
  comp.attack.value=0.003; comp.release.value=0.25;
  comp.connect(AC.destination);
  MASTER=AC.createGain(); MASTER.gain.value=0.85; MASTER.connect(comp);
  const rev=AC.createConvolver(); rev.buffer=makeIR(AC,1.5,2.6);
  REVSEND=AC.createGain(); REVSEND.gain.value=0.16;
  REVSEND.connect(rev); rev.connect(MASTER);
  WAVES=makeWaves(AC);
  return AC;
}
function synthOn(note,vel,when){
  const c=ac(), t=Math.max(when, c.currentTime);
  const f=440*Math.pow(2,(note-69)/12), v=clamp(vel/127,0.02,1);
  const T1=clamp(1.2+1400/f, 1.1, 8);      /* 低い音ほど長く残る */
  const out=c.createGain(); out.gain.value=1;
  const lp=c.createBiquadFilter();
  lp.type='lowpass'; lp.Q.value=0.5;
  out.connect(lp); lp.connect(MASTER); lp.connect(REVSEND);
  const oscs=[];

  /* 録音した音があればそれを鳴らす。強さは音量と明るさの両方で表す
     （録音は1段階の強さしか無いので、弱い音はローパスで暗くする） */
  if(PIANO.state==='ready'){
    const base=nearestSample(note), src=c.createBufferSource(), g=c.createGain();
    src.buffer=PIANO.bufs.get(base);
    src.playbackRate.value=Math.pow(2,(note-base)/12);
    lp.frequency.value=clamp(900*Math.pow(2,4.0*v), 900, 16000);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(clamp(1.35*Math.pow(v,1.4),0.001,2), t+0.003);
    src.connect(g); g.connect(out);
    src.start(t);
    oscs.push(src);
    const dur=src.buffer.duration/src.playbackRate.value;
    const voice={out,oscs,end:t+dur};
    if(!voices.has(note)) voices.set(note,[]);
    voices.get(note).push(voice);
    if(voices.size>140) for(const [n,l] of voices) if(l.every(x=>x.end<c.currentTime)) voices.delete(n);
    return voice;
  }
  lp.frequency.value=clamp(f*(12+12*v), 1600, 15000);   /* 強く弾くほど明るい */

  const group=(wave,gain,dec,detune)=>{
    if(gain<0.0004) return;
    const o=c.createOscillator(), g=c.createGain();
    o.setPeriodicWave(wave); o.frequency.value=f; if(detune) o.detune.value=detune;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain, t+0.004);
    if(dec>2){                              /* 低め・長めの音は二段階で落とす */
      g.gain.exponentialRampToValueAtTime(gain*0.30, t+0.45);
      g.gain.exponentialRampToValueAtTime(0.00008, t+dec);
    }else g.gain.exponentialRampToValueAtTime(0.00008, t+dec);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t+dec+0.1);
    oscs.push(o);
  };
  /* 強く弾くほど上の倍音が増える（音量だけでなく音色が変わる） */
  const A=0.10*Math.pow(v,1.15);
  group(WAVES[0], A*0.58, T1,  -1.4);       /* 弦を2本に分けてうならせる */
  group(WAVES[0], A*0.50, T1,  +1.4);   /* 2本の弦。少し量を変えて、うなりで消えきらないようにする */
  group(WAVES[1], A*1.00*Math.pow(v,1.1), T1*0.36, 0);
  group(WAVES[2], A*0.75*Math.pow(v,1.6), T1*0.22, 0);
  /* 打鍵の雑音 */
  const nb=c.createBuffer(1,Math.ceil(c.sampleRate*0.03),c.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,3);
  const ns=c.createBufferSource(), nf=c.createBiquadFilter(), ng=c.createGain();
  ns.buffer=nb; nf.type='bandpass'; nf.frequency.value=clamp(f*5,600,6000); nf.Q.value=0.8;
  ng.gain.value=0.035*Math.pow(v,2.2);
  ns.connect(nf).connect(ng).connect(out); ns.start(t);

  const voice={out,oscs,end:t+T1+0.2};
  if(!voices.has(note)) voices.set(note,[]);
  voices.get(note).push(voice);
  /* 古い音が溜まりすぎないよう、終わったものは捨てる */
  if(voices.size>140) for(const [n,l] of voices) if(l.every(x=>x.end<c.currentTime)) voices.delete(n);
  return voice;
}
function synthOff(note,when){
  if(note>=NO_DAMPER) return;               /* ダンパーが無い音域は止まらない */
  const c=ac(), t=Math.max(when, c.currentTime), list=voices.get(note);
  if(!list) return;
  const f=440*Math.pow(2,(note-69)/12);
  const rel=clamp(0.07+30/f, 0.07, 0.32);   /* 低音のダンパーはゆっくり効く */
  for(const v of list){
    try{
      v.out.gain.cancelScheduledValues(t);
      v.out.gain.setValueAtTime(v.out.gain.value,t);
      v.out.gain.exponentialRampToValueAtTime(0.0001, t+rel);
    }catch(e){}
    for(const o of v.oscs){ try{ o.stop(t+rel+0.05); }catch(e){} }
  }
  voices.delete(note);
}
function synthAllOff(){
  const t=AC?AC.currentTime:0;
  for(const [n,list] of voices){
    for(const v of list){
      try{ v.out.gain.cancelScheduledValues(t); v.out.gain.setValueAtTime(v.out.gain.value,t);
           v.out.gain.exponentialRampToValueAtTime(0.0001,t+0.08); }catch(e){}
      for(const o of v.oscs){ try{ o.stop(t+0.12); }catch(e){} }
    }
  }
  voices.clear(); sustained.clear();
}

/* ---- 出力先 ---- */
function refreshOutputs(){
  const sel=$('outSel'), prev=sel.value;
  const opts=['<option value="">内蔵音（ピアノ音源）</option>'];

  else if(sel.options.length>1) sel.selectedIndex=1;
}

  const id=$('outSel').value;
  if(!id||!midi) return null;

/* ---- 送信 ---- */
function pbSend(e, when){
  if(PB.out){
    if(e.k==='on'){ PB.out.send([0x90,e.a,e.b],when); PB.onNotes.add(e.a); }
    else if(e.k==='off'){ PB.out.send([0x80,e.a,0x40],when); PB.onNotes.delete(e.a); }
    else PB.out.send([0xB0,e.a,e.b],when);
    return;
  }
  /* 内蔵音。ペダルを踏んでいる間の離鍵は消さず、離した時点でまとめて消す */
  const c=ac(), at=c.currentTime+(when-performance.now())/1000;
  if(e.k==='on'){ synthOn(e.a,e.b,at); sustained.delete(e.a); }
  else if(e.k==='off'){ if(PB.damper>=64) sustained.add(e.a); else synthOff(e.a,at); }
  else if(e.k==='cc' && e.a===64 && e.b<64){
    for(const n of sustained) synthOff(n,at);
    sustained.clear();
  }
}
function pbTickSend(){
  const take=curTake(); if(!take||!PB.playing) return;
  const ev=take.events, horizon=pbElapsed()+LOOKAHEAD;
  while(PB.sendIdx<ev.length && ev[PB.sendIdx].t<=horizon){
    const e=ev[PB.sendIdx++];
    const when=PB.startAt+(e.t-PB.offset);
    if(e.k==='cc'&&e.a===64) { pbSend(e,when); PB.damper=e.b; }
    else pbSend(e,when);
  }
}
/* 画面をいまの再生位置まで進める。何度呼んでも同じところで止まる */
function pbAdvance(){
  if(!PB.playing) return;
  const take=curTake(); if(!take){ stopPlay(); return; }
  const ev=take.events, now=pbElapsed();
  while(PB.dispIdx<ev.length && ev[PB.dispIdx].t<=now){
    const e=ev[PB.dispIdx++];
    if(e.k==='on') noteOn(e.a,e.b);
    else if(e.k==='off') noteOff(e.a);
    else controlPedal(e.a,e.b);
  }
  PB.pos=now;
  refreshSeek();
  $("playStat").textContent=`再生中 ${fmtTime(now)} / ${fmtTime(take.dur)}`;
  $("playStat").className="stat ok";
  if(now>=take.dur+200) stopPlay();
}
/* なめらかさは rAF に任せるが、裏のタブなどで rAF が止まっても
   終わりを見落とさないよう、送信のタイマー側でも同じ処理を回す */
function pbTickDisplay(){
  if(!PB.playing) return;
  pbAdvance();
  if(PB.playing) PB.raf=requestAnimationFrame(pbTickDisplay);
}
async function startPlay(from){
  const take=curTake(); if(!take||S.recording) return;
  stopPlay(true);
  const request=PB.request;
  PB.pos=clamp(from??PB.pos,0,take.dur);
  refreshSeek();
  if(!outputPort()){
    try{ ac().resume(); }catch(e){}
    /* 初回だけ、録音されたピアノの音を取りに行く */
    if(PIANO.state==='none'){
      $('btnPlay').disabled=true;
      await loadPiano((d,n)=>{ $('playStat').textContent=`ピアノ音源を読み込み中… ${d}/${n}`; $('playStat').className='stat'; });
      $('btnPlay').disabled=false;
      $('playStat').textContent = PIANO.state==='ready' ? '' : '音源を取得できなかったので合成音で鳴らします';
    }
  }
  if(request!==PB.request||curTake()!==take) return;
  PB.out=outputPort();
  panic();
  ribbons.length=0;
  PB.playing=true;
  document.body.classList.add('playing');
  PB.offset=clamp(PB.pos, 0, Math.max(0,take.dur-50));
  PB.pos=PB.offset;
  PB.startAt=performance.now();
  PB.damper=0; PB.onNotes.clear();
  /* 途中から鳴らすときは、そこまでのペダルの状態を先に作っておく */
  const ev=take.events;
  let i=0; while(i<ev.length && ev[i].t<PB.offset) i++;
  PB.sendIdx=i; PB.dispIdx=i;
  const state=playbackState(take,PB.offset);
  S.held=state.held; S.vel=state.vel; S.pedHeld=state.pedHeld; S.sost=state.sost; S.cc=state.cc;
  for(const cc of [64,66,67]) if(state.seen[cc]) S.seenCC[cc]=true;
  PB.damper=state.cc[64];
  const when=performance.now();
  for(const [n,v] of state.held) pbSend({k:'on',a:n,b:v},when);
  for(const n of state.pedHeld) pbSend({k:'on',a:n,b:state.vel.get(n)||80},when);
  for(const cc of [64,66,67]) if(state.cc[cc]>0) pbSend({k:'cc',a:cc,b:state.cc[cc]},when);
  for(const n of state.pedHeld) pbSend({k:'off',a:n,b:0},when+1);
  render();
  $('btnPlay').textContent='■ 停止';
  $('btnRec').disabled=true;
  refreshSeek();
  pbTickSend();
  PB.timer=setInterval(()=>{ pbTickSend(); pbAdvance(); },60);
  PB.raf=requestAnimationFrame(pbTickDisplay);
}
function stopPlay(quiet){
  PB.request++;
  if(PB.timer) clearInterval(PB.timer);
  if(PB.raf) cancelAnimationFrame(PB.raf);
  PB.timer=PB.raf=null;
  const was=PB.playing;
  PB.playing=false;
  document.body.classList.remove('playing');
  if(PB.out){
    /* 先に送ってある予定を取り消し、鳴りっぱなしを確実に止める。
       CC123 を無視する機種があるので、88鍵ぶんのノートオフも送る */
    try{ PB.out.clear&&PB.out.clear(); }catch(e){}
    try{
      PB.out.send([0xB0,64,0]); PB.out.send([0xB0,66,0]);
      for(let n=KB_LO;n<=KB_HI;n++) PB.out.send([0x80,n,0x40]);
      PB.out.send([0xB0,123,0]);
    }catch(e){}
  }
  PB.onNotes.clear();
  synthAllOff();
  PB.out=null;
  if(was) panic();
  if(!quiet) PB.pos=0;
  $('btnPlay').textContent='▶ 再生';
  $('btnRec').disabled=false;
  if(was&&!quiet){ $("playStat").textContent=""; }
  refreshSeek();
}


const TPQ=480, USQ=500000;                     /* ♩=120 として、1tick ≒ 1.0417ms */
const ms2tick = ms => Math.round(ms*TPQ*1000/USQ);
function varLen(v){ const b=[v&0x7f]; v=Math.floor(v/128); while(v>0){ b.unshift((v&0x7f)|0x80); v=Math.floor(v/128); } return b; }
/* このアプリの format 0 書き出しを読み戻す。音符と CC64/66/67 のみ扱う。 */
function fromSMF(buf,name){
  const d=new DataView(buf); let p=0;
  const fail=()=>{ throw new Error('このアプリで保存した.midファイルを選んでください'); };
  const need=n=>{ if(p+n>d.byteLength) fail(); };
  const u8=()=>{ need(1); return d.getUint8(p++); };
  const u16=()=>{ need(2); const n=d.getUint16(p); p+=2; return n; };
  const u32=()=>{ need(4); const n=d.getUint32(p); p+=4; return n; };
  const tag=()=>String.fromCharCode(u8(),u8(),u8(),u8());
  const vlq=()=>{ let n=0; for(let i=0;i<4;i++){ const b=u8(); n=n*128+(b&127); if(!(b&128)) return n; } fail(); };
  if(tag()!=='MThd'||u32()!==6||u16()!==0||u16()!==1||u16()!==TPQ) fail();
  if(tag()!=='MTrk') fail();
  const trackLen=u32(), end=p+trackLen; if(end>d.byteLength) fail();
  const events=[]; let tick=0, status=0, tempo=false, ended=false;
  while(p<end){
    tick+=vlq(); if(!Number.isSafeInteger(tick)) fail();
    let st=u8();
    if(st<0x80){ if(!status) fail(); p--; st=status; }
    else if(st<0xF0) status=st;
    else status=0;
    if(st===0xFF){
      const type=u8(), len=vlq(); need(len);
      if(type===0x51){ if(len!==3||tempo||((u8()<<16)|(u8()<<8)|u8())!==USQ) fail(); tempo=true; }
      else if(type===0x2F){ if(len!==0||p!==end) fail(); ended=true; break; }
      else fail();
      continue;
    }
    if((st&15)!==0) fail();
    const kind=st&0xF0, a=u8(), b=u8(); if(a>127||b>127) fail();
    const t=Math.round(tick*USQ/(TPQ*1000));
    if(kind===0x90) events.push({t,k:b?'on':'off',a,b:b||0});
    else if(kind===0x80) events.push({t,k:'off',a,b:0});
    else if(kind===0xB0 && [64,66,67].includes(a)) events.push({t,k:'cc',a,b});
    else fail();
    if(events.length>500000) fail();
  }
  if(!tempo||!ended||!events.length) fail();
  const at=Date.now();
  return {id:'t'+at+'-'+Math.random().toString(36).slice(2,8),at,name,dur:Math.round(tick*USQ/(TPQ*1000)),events};
}
function toSMF(take){
  const tr=[];
  tr.push(0x00,0xFF,0x51,0x03,(USQ>>16)&0xff,(USQ>>8)&0xff,USQ&0xff);
  let prev=0;
  for(const e of take.events){
    const tk=ms2tick(e.t);
    tr.push(...varLen(tk-prev)); prev=tk;
    if(e.k==='on') tr.push(0x90,e.a&0x7f,e.b&0x7f);
    else if(e.k==='off') tr.push(0x80,e.a&0x7f,0x40);
    else tr.push(0xB0,e.a&0x7f,e.b&0x7f);
  }
  tr.push(...varLen(Math.max(0,ms2tick(take.dur)-prev)),0xFF,0x2F,0x00);
  const len=tr.length;
  const bytes=[
    0x4D,0x54,0x68,0x64, 0,0,0,6, 0,0, 0,1, (TPQ>>8)&0xff,TPQ&0xff,
    0x4D,0x54,0x72,0x6B, (len>>24)&0xff,(len>>16)&0xff,(len>>8)&0xff,len&0xff,
    ...tr,
  ];
  return new Uint8Array(bytes);
}
function download(name,blob){
  const a=document.createElement('a'), url=URL.createObjectURL(blob);
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },0);
}
function datedMidName(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}.mid`;
}

/* ===== 操作バー：つながったあと、マウスが止まっていれば隠す ===== */
let hideT=null;
function armHide(){
  clearTimeout(hideT);
  document.body.classList.remove('hidebar');
  if(!midi) return;                       /* まだ接続していないうちは出しておく */
  hideT=setTimeout(()=>document.body.classList.add('hidebar'), 2500);
}
addEventListener('mousemove',armHide);
addEventListener('touchstart',armHide);

/* ===== 設定 ===== */
const LS='pm.keys.';
function applyOpts(){
  document.body.classList.toggle('clear', S.clear);
  document.body.classList.toggle('noped', !S.showPed);
  document.body.classList.toggle('flowon', S.flow);
  $('optVel').checked=S.showVel;
  $('optPed').checked=S.showPed;
  $('optClear').checked=S.clear;
  $('optFlow').checked=S.flow;
  $('flowSpd').value=Math.round(S.flowSec*10);
  $('spdVal').textContent=S.flowSec.toFixed(1);
  syncRibbons();
  render();
  if(S.flow) flowStart();
}
function saveOpts(){
  try{ localStorage.setItem(LS+'opts',JSON.stringify(
    {showVel:S.showVel, showPed:S.showPed, clear:S.clear, flow:S.flow, flowSec:S.flowSec})); }catch(e){}
}
(function loadOpts(){
  try{
    const o=JSON.parse(localStorage.getItem(LS+'opts')||'{}');
    if(typeof o.showVel==='boolean') S.showVel=o.showVel;
    if(typeof o.showPed==='boolean') S.showPed=o.showPed;
    if(typeof o.clear==='boolean') S.clear=o.clear;
    if(typeof o.flow==='boolean') S.flow=o.flow;
    if(typeof o.flowSec==='number') S.flowSec=clamp(o.flowSec,1,8);
  }catch(e){}
  /* URL のほうが強い。配信ソフトには ?clear=1&bar=0 のように渡す */
  S.showVel=qb('vel',S.showVel);
  S.showPed=qb('pedal',S.showPed);
  S.clear=qb('clear',S.clear);
  S.flow=qb('flow',S.flow);
  if(Q.has('sec')) S.flowSec=clamp(parseFloat(Q.get('sec'))||3, 1, 8);
  if(!qb('bar',true)) document.body.classList.add('nobar');
})();

$('btnConnect').addEventListener('click',()=>connectMidi(false));
$('btnRec').addEventListener('click',()=>S.recording?stopRec():startRec());
$('btnPlay').addEventListener('click',()=>PB.playing?stopPlay():startPlay(PB.pos));
$('seek').addEventListener('pointerdown',e=>{
  if(!curTake()||S.recording) return;
  e.currentTarget.setPointerCapture(e.pointerId);
  const pos=PB.playing?clamp(pbElapsed(),0,curTake().dur):PB.pos;
  barSeek.active=true; barSeek.resume=PB.playing;
  if(PB.playing) stopPlay(true);
  PB.pos=pos; PB.scrubbing=true;
});
$('seek').addEventListener('input',e=>{
  PB.pos=+e.target.value;
  refreshSeek();
  if(!barSeek.active&&PB.playing) startPlay(PB.pos);
});
$('seek').addEventListener('pointerup',finishBarSeek);
$('seek').addEventListener('pointercancel',finishBarSeek);
const barSeek={active:false,resume:false};
function finishBarSeek(){
  if(!barSeek.active) return;
  const resume=barSeek.resume;
  barSeek.active=false; PB.scrubbing=false;
  if(resume) startPlay(PB.pos);
  else refreshSeek();
}
const flowGesture={active:false,id:null,startY:0,startPos:0,moved:false};
$('flow').addEventListener('pointerdown',e=>{
  const take=curTake();
  if(!S.flow||!PB.playing||!take||S.recording) return;
  e.preventDefault(); $('flow').setPointerCapture(e.pointerId);
  flowGesture.active=true; flowGesture.id=e.pointerId;
  flowGesture.startY=e.clientY;
  flowGesture.startPos=clamp(pbElapsed(),0,take.dur);
  flowGesture.moved=false;
  stopPlay(true); PB.pos=flowGesture.startPos; PB.scrubbing=true; refreshSeek();
});
$('flow').addEventListener('pointermove',e=>{
  if(!flowGesture.active||e.pointerId!==flowGesture.id) return;
  const take=curTake(); if(!take) return;
  const dy=e.clientY-flowGesture.startY;
  if(Math.abs(dy)>4) flowGesture.moved=true;
  if(flowGesture.moved){
    PB.pos=clamp(flowGesture.startPos-dy/$('flow').getBoundingClientRect().height*S.flowSec*1000,0,take.dur);
    refreshSeek();
  }
});
$('flow').addEventListener('pointerup',e=>{
  if(!flowGesture.active||e.pointerId!==flowGesture.id) return;
  const take=curTake();
  if(take&&!flowGesture.moved){
    const rect=$('flow').getBoundingClientRect();
    PB.pos=clamp(flowGesture.startPos-(rect.bottom-e.clientY)/rect.height*S.flowSec*1000,0,take.dur);
  }
  flowGesture.active=false; PB.scrubbing=false;
  if(take) startPlay(PB.pos);
});
$('flow').addEventListener('pointercancel',e=>{
  if(!flowGesture.active||e.pointerId!==flowGesture.id) return;
  flowGesture.active=false; PB.scrubbing=false;
  if(curTake()) startPlay(flowGesture.startPos);
});
$('takeSel').addEventListener('change',e=>{ stopPlay(); S.curId=e.target.value; refreshTakes(); });
$('outSel').addEventListener('change',()=>{
  if(PB.playing){ stopPlay(); startPlay(0); }
});
$('btnMid').addEventListener('click',()=>{
  const take=curTake(); if(take) download(datedMidName(),new Blob([toSMF(take)],{type:'audio/midi'}));
});
$('btnDel').addEventListener('click',async ()=>{
  const take=curTake(); if(!take||!await confirmDelete(take.name)) return;
  stopPlay();
  S.takes=S.takes.filter(t=>t.id!==take.id);
  S.curId=S.takes[0]?.id||null;
  saveTakes(); refreshTakes();
  $('playStat').textContent='録音を削除しました';
  $('playStat').className='stat';
});
$('btnImport').addEventListener('click',()=>$('midFile').click());
$('midFile').addEventListener('change',async e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  stopPlay();
  try{
    if(file.size>16*1024*1024) throw new Error('ファイルが大きすぎます（上限16MB）');
    const take=fromSMF(await file.arrayBuffer(),file.name);
    S.takes.unshift(take); S.curId=take.id;
    saveTakes(); refreshTakes();
    $('playStat').textContent=`${file.name} を読み込みました`;
    $('playStat').className='stat ok';
  }catch(err){
    $('playStat').textContent=err.message;
    $('playStat').className='stat ng';
  }
});
$('optFlow').addEventListener('change',e=>{ S.flow=e.target.checked; saveOpts(); applyOpts(); });
$('flowSpd').addEventListener('input',e=>{
  S.flowSec=(+e.target.value)/10;
  $('spdVal').textContent=S.flowSec.toFixed(1);
  saveOpts();
});
$('optVel').addEventListener('change',e=>{ S.showVel=e.target.checked; saveOpts(); applyOpts(); });
$('optPed').addEventListener('change',e=>{ S.showPed=e.target.checked; saveOpts(); applyOpts(); });
$('optClear').addEventListener('change',e=>{ S.clear=e.target.checked; saveOpts(); applyOpts(); });
addEventListener('resize',()=>{ G=null; render(); });

loadTakes(); refreshTakes(); refreshOutputs(); applyOpts();
addEventListener('storage',e=>{
  if(e.key!==LS_TAKES||S.recording) return;
  stopPlay(); loadTakes(); refreshTakes();
});
if(!navigator.requestMIDIAccess){
  setStatus('このブラウザは Web MIDI API に非対応です','ng');
  $('btnConnect').disabled=true;
}else{
  /* すでに許可されていれば、開いただけでつながる（配信ソフト用） */
  connectMidi(true);
}
</script>
